name: 'Terraform EKS Infrastructure - With K8s Rbac'

on:
  push:
    branches:
      - main
    paths:
      - 'Terraform/**'
      - '.github/workflows/*'
      - 'Kubernetes-Manifest-File/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  # ==========================================
  # JOB 1: PLAN (Only runs on Pull Requests)
  # ==========================================
  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: ./Terraform/Calling-Modules

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ..

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -lock-timeout=300s -var-file="test.tfvars"

  # ==========================================
  # JOB 2: APPLY (Only runs on Push to Main)
  # ==========================================
  apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment: Prod

    defaults:
      run:
        working-directory: ./Terraform/Calling-Modules

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -lock-timeout=300s -var-file="test.tfvars" -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=300s tfplan

      - name: Build VPN config file
        run: |
          VPN_ID=$(aws ec2 describe-client-vpn-endpoints --query "ClientVpnEndpoints[?Description=='terraform-clientvpn-example'].ClientVpnEndpointId | [0]" --output text)
          [ "$VPN_ID" != "None" ] || (echo "VPN endpoint not found" && exit 1)
          aws ec2 export-client-vpn-client-configuration --client-vpn-endpoint-id "$VPN_ID" --output text > vpn.ovpn
          
          # Save the outputs to temporary files first to bypass GitHub's log masking
          terraform output -raw client_cert > /tmp/client.crt
          terraform output -raw client_key > /tmp/client.key
          
          {
            echo "<cert>"
            cat /tmp/client.crt
            echo ""
            echo "</cert>"
            echo "<key>"
            cat /tmp/client.key
            echo ""
            echo "</key>"
          } >> vpn.ovpn
          
          # Clean up temporary key files
          rm /tmp/client.crt /tmp/client.key

      - name: Connect to VPN
        run: |
          sudo apt-get update && sudo apt-get install -y openvpn openvpn-systemd-resolved
          sudo openvpn --config vpn.ovpn --daemon --script-security 2 --up /etc/openvpn/update-systemd-resolved --down /etc/openvpn/update-systemd-resolved --down-pre --dhcp-option DOMAIN-ROUTE .
          sleep 20
          ip link show tun0 || (echo "VPN did not connect" && exit 1)

      - name: Apply Rbac to the cluster
        run: |
          aws eks update-kubeconfig --name Dev-YT-Performance-Cluster --region us-east-1
          # Note: Path goes up two levels to reach the root folder
          kubectl apply -f ../../Kubernetes-Manifest-File/rbac.yaml

      - name: Apply IRSA (IAM Role for Service Accounts)
        run: |
         
          kubectl apply -f ../../Kubernetes-Manifest-File/service-account.yaml
          kubectl apply -f ../../Kubernetes-Manifest-File/pod.yaml
          kubectl wait --for=condition=Ready pod/aws-cli-pod --timeout=60s
          kubectl exec aws-cli-pod -- aws s3 ls