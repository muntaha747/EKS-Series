name: 'Terraform EKS Infrastructure - With K8s Rbac' 

on:
  push:
    branches:
      - main #
    paths:
      - 'Terraform/**'
      - '.github/workflows/*'
      - 'Kubernetes-Manifest-File/*'
  pull_request:
    branches:
      - main
  workflow_dispatch: 

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  # ==========================================
  # JOB 1: PLAN (Only runs on Pull Requests)
  # ==========================================
  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    defaults:
      run:
        working-directory: ./Terraform/Calling-Modules # Ensure this path is correct

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -no-color -var-file="test.tfvars"

  # ==========================================
  # JOB 2: APPLY (Only runs on Push to Main)
  # ==========================================
  apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    # This triggers the manual approval pause you asked for
    environment: Prod
    
    defaults:
      run:
        working-directory: ./Terraform/Calling-Modules # Ensure this path is correct

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -lock-timeout=300s -var-file="test.tfvars"

      - name: Output VPN Certificates
        run: |
          echo "=== CLIENT CERTIFICATE ==="
          terraform output -raw client_cert
          
          echo "=== CLIENT PRIVATE KEY (BASE64 ENCODED) ==="
          terraform output -raw client_key | base64

      - name: Build VPN config file
        run: |
          VPN_ID=$(aws ec2 describe-client-vpn-endpoints --query "ClientVpnEndpoints[?Description=='terraform-clientvpn-example'].ClientVpnEndpointId | [0]" --output text)
          [ "$VPN_ID" != "None" ] || (echo "VPN endpoint not found" && exit 1)
          aws ec2 export-client-vpn-client-configuration --client-vpn-endpoint-id "$VPN_ID" --output text > vpn.ovpn
          {
            echo "<cert>"
            terraform output -raw client_cert
            echo ""
            echo "</cert>"
            echo "<key>"
            terraform output -raw client_key
            echo ""
            echo "</key>"
          } >> vpn.ovpn

      - name: Upload VPN config as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-config
          path: Terraform/Calling-Modules/vpn.ovpn
          retention-days: 1

      - name: Connect to VPN
        run: |
          sudo apt-get update && sudo apt-get install -y openvpn openvpn-systemd-resolved
          sudo openvpn --config vpn.ovpn --daemon --script-security 2 --up /etc/openvpn/update-systemd-resolved --down /etc/openvpn/update-systemd-resolved --down-pre --dhcp-option DOMAIN-ROUTE .
          sleep 30
          ip link show tun0 || (echo "VPN did not connect" && exit 1)

      - name: Apply Rbac to the cluster
        run: |
          aws eks update-kubeconfig --name Dev-YT-Performance-Cluster --region us-east-1
          kubectl apply -f ../../Kubernetes-Manifest-File/rbac.yaml