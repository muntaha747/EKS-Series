name: 'Destroy EKS Infrastructure'

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'

    # With "Required reviewers" set on Prod, this pauses for approval before destroying.
    environment: Prod

    defaults:
      run:
        working-directory: ./Terraform/Calling-Modules

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Terraform Init
        run: terraform init

      - name: Delete leftover access keys of the Hassan user
        run: |
          for KEY in $(aws iam list-access-keys --user-name Hassan --query 'AccessKeyMetadata[].AccessKeyId' --output text 2>/dev/null); do
            aws iam delete-access-key --user-name Hassan --access-key-id "$KEY"
          done || true

      - name: Delete SA, Pods, and RBAC
        run: |
          aws eks update-kubeconfig --name Dev-YT-Performance-Cluster --region us-east-1
          
          kubectl delete sa s3-access-sa --ignore-not-found
          kubectl delete pod aws-cli-pod --ignore-not-found
          kubectl delete clusterrole hassan-devops-role --ignore-not-found
          kubectl delete clusterrolebinding hassan-devops-binding --ignore-not-found

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -lock-timeout=300s -var-file="test.tfvars"